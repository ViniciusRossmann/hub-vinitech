apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-vinitech-ing
  namespace: apps
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - viniciusnunes.dev.br
        - www.viniciusnunes.dev.br
  rules:
    - host: viniciusnunes.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hub-vinitech-svc
                port:
                  number: 3000
    - host: www.viniciusnunes.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hub-vinitech-svc
                port:
                  number: 3000