apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-vinitech
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hub-vinitech
  template:
    metadata:
      labels:
        app: hub-vinitech
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: hub-vinitech-app
          image: ghcr.io/viniciusrossmann/hub-vinitech:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_CACHE_DIR
              value: "/app/.next/cache"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: next-cache
          emptyDir: {}